# Publica el sitio en GitHub Pages cada vez que se sube un cambio a la rama main.
# Construye dist/ con build.mjs y publica solo esa carpeta.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # PRODUCCIÓN: el sitio se puede indexar en Google.
      # --base: GitHub Pages sirve el sitio en /nombre-del-repo/ (la página 404 lo necesita).
      # --site: dirección pública real, usada por Google, el sitemap y las vistas previas al compartir.
      # Si conectas un dominio propio (ej. locker10.gt): usa --base=/ --site=https://locker10.gt
      # Para volver a modo vista previa (sin indexar) agrega --preview.
      - run: node build.mjs --base=/${{ github.event.repository.name }}/ --site=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
